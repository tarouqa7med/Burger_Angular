<section class="py-5" id="contact">
        <div class="container">
                <h1 class="text-white text-center mb-5">Book Now</h1>
                <form action="" class="text-white m-auto">
                        <div class="mb-5">
                                <label for="name" class="form-label">Name :</label>
                                <input type="text" class="form-control" id="name">
                        </div>
                        <div class="mb-5">
                                <label for="peopleNumber" class="form-label">How many people :</label>
                                <input type="number" class="form-control" id="peopleNumber">
                        </div>
                        <div class="mb-5">
                                <label for="date" class="form-label">Date :</label>
                                <input type="date" class="form-control" id="date">
                        </div>
                        <div class="mb-5">
                                <label for="message" class="form-label">Message :</label>
                                <textarea type="text" class="form-control" id="message"></textarea>
                        </div>
                        <button class="w-100 text-white fs-3 fw-bold rounded-3" type="submit">Book</button>
                </form>
        </div>
</section>
